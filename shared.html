<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeamVault — Shared File</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=7">
<style>
  .shared-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; position: relative; overflow: hidden;
  }
  .shared-card {
    width: 100%; max-width: 440px; padding: 40px 36px;
    background: var(--glass-bg); backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid var(--glass-border); border-radius: 22px;
    box-shadow: var(--glass-shadow); text-align: center;
    animation: modal-pop .5s cubic-bezier(.16,1,.3,1) both;
  }
  .shared-logo { font-family: var(--display); font-size: 28px; font-weight: 700; color: var(--text); display: flex; align-items: center; justify-content: center; gap: 10px; }
  .shared-hex { font-size: 30px; color: var(--accent); }
  .shared-name { font-size: 18px; font-weight: 600; color: var(--text); margin: 22px 0 4px; word-break: break-word; }
  .shared-meta { font-size: 12px; color: var(--muted); margin-bottom: 22px; min-height: 16px; }
  .shared-state { font-size: 13px; color: var(--muted); margin: 18px 0; }
  .shared-err { color: var(--danger); font-size: 12px; min-height: 16px; margin-top: 8px; }
  .shared-spinner {
    width: 34px; height: 34px; margin: 24px auto; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.15); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .shared-success-icon { font-size: 52px; margin: 8px 0; animation: pop .5s cubic-bezier(.16,1,.3,1) both; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .shared-expired { font-size: 40px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="shared-wrap">
  <div class="hex-grid"></div>
  <div class="login-glow"></div>
  <div class="shared-card" id="card">
    <div class="shared-logo"><span class="shared-hex">⬡</span> TeamVault</div>
    <div id="content">
      <div class="shared-spinner"></div>
      <div class="shared-state">Loading shared file…</div>
    </div>
  </div>
</div>

<script>
const token = decodeURIComponent((location.pathname.split("/shared/")[1] || "").split("/")[0].split("?")[0].trim());
const content = document.getElementById("content");
if (!token) { document.getElementById("content").innerHTML = '<div class="shared-expired">🔒</div><div class="shared-name">Invalid link</div><div class="shared-meta">Missing token.</div>'; }

async function loadInfo() {
  try {
    const r = await fetch(`/api/shared/${token}/info`);
    if (!r.ok) return showError();
    const d = await r.json();
    if (d.has_password) {
      showPasswordPrompt(d);
    } else {
      showDownload(d, "");
    }
  } catch { showError(); }
}

function showPasswordPrompt(d) {
  content.innerHTML = `
    <div class="shared-name">${escapeHtml(d.filename || "Shared file")}</div>
    <div class="shared-meta">${fmtSize(d.size_bytes)} · Password protected</div>
    <div class="field" style="text-align:left">
      <label>Password</label>
      <div class="pw-field">
        <input id="pw" type="password" placeholder="Enter link password" autocomplete="off">
        <button type="button" class="pw-toggle" data-target="pw" aria-label="Show password">👁️</button>
      </div>
    </div>
    <button class="btn-primary" id="submit" style="width:100%;margin-top:6px">Unlock & Download</button>
    <div class="shared-err" id="err"></div>`;
  const pw = document.getElementById("pw");
  pw.focus();
  const go = () => showDownload(d, pw.value);
  document.getElementById("submit").onclick = go;
  pw.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  // rebind eye toggle for dynamically injected pw
  content.querySelectorAll(".pw-toggle[data-target]").forEach(btn => {
    btn.onclick = () => {
      const input = document.getElementById(btn.dataset.target);
      if (!input) return;
      if (input.type === "password") { input.type = "text"; btn.textContent = "🙈"; }
      else { input.type = "password"; btn.textContent = "👁️"; }
    };
  });
}

function getSharedPassphrase(orgId) {
  if (orgId) return `tv-auto-${orgId}`;
  return "tv-auto-device-fallback";
}
async function deriveKey(passphrase) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: enc.encode("teamvault-fixed-salt"), iterations: 200000, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
function getMime(ext) {
  const m = { png:"image/png", jpg:"image/jpeg", jpeg:"image/jpeg", gif:"image/gif", svg:"image/svg+xml", webp:"image/webp", bmp:"image/bmp", heic:"image/heic", heif:"image/heif", avif:"image/avif", tiff:"image/tiff", ico:"image/x-icon", pdf:"application/pdf", mp4:"video/mp4", webm:"video/webm", mp3:"audio/mpeg", wav:"audio/wav" };
  return m[ext] || "application/octet-stream";
}
const CHUNKED_MAGIC = new Uint8Array([0x54,0x56,0x43,0x48,0x4e,0x4b,0x30,0x31,0,0,0,0,0,0,0,0]);
function _readU32be(buf, off){ return ((buf[off]<<24)|(buf[off+1]<<16)|(buf[off+2]<<8)|buf[off+3])>>>0; }
function concatBytes(parts){ let n=0; for(const p of parts) n+=p.length; const o=new Uint8Array(n); let off=0; for(const p of parts){o.set(p,off);off+=p.length;} return o; }
async function decryptAssembled(ct, passphrase){
  const key = await deriveKey(passphrase);
  if (ct.length < 16) throw new Error("Empty/corrupt ciphertext");
  const chunked = ct.subarray(0,16).every((b,i)=>b===CHUNKED_MAGIC[i]);
  if (!chunked) {
    const iv = ct.subarray(0,12); const body = ct.subarray(12);
    return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, body));
  }
  const out = []; let pos = 0; let first = true;
  while (pos < ct.length) {
    const prefix = first ? 16 : 0;
    if (ct.length - pos < prefix + 4) throw new Error("Truncated ciphertext");
    const len = _readU32be(ct, pos + prefix);
    const recLen = prefix + 4 + len;
    if (ct.length - pos < recLen) throw new Error("Truncated ciphertext");
    const iv = ct.subarray(pos + prefix + 4, pos + prefix + 4 + 12);
    const body = ct.subarray(pos + prefix + 4 + 12, pos + recLen);
    out.push(new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, body)));
    first = false; pos += recLen;
  }
  return concatBytes(out);
}
async function fetchAllChunksShared(tok, password, total, onProg){
  const results = []; let next = 0, stop = false, received = 0; const CONC = 6;
  async function worker(){
    while (!stop) {
      const i = next++;
      const r = await fetch(`/api/shared/${tok}/chunk/${i}?password=${encodeURIComponent(password || "")}`);
      if (r.status === 404) { stop = true; return; }
      if (!r.ok) {
        let j = {}; try { j = await r.json(); } catch {}
        if (r.status === 401) throw new Error("Incorrect password");
        throw new Error(j.error || "Chunk fetch failed");
      }
      const buf = new Uint8Array(await r.arrayBuffer());
      results[i] = buf; received += buf.length;
      if (total) { const pct = Math.min(99, Math.round(received / total * 100)); onProg(pct, `⬇ ${pct}%`); }
      else onProg(0, `⬇ ${fmtSize(received)}`);
    }
  }
  await Promise.all(Array.from({length: CONC}, worker));
  let n = 0; for (const c of results) if (c) n += c.length;
  const out = new Uint8Array(n); let o = 0;
  for (const c of results) if (c) { out.set(c, o); o += c.length; }
  return out;
}
async function showDownload(d, password) {
  content.innerHTML = `
    <div class="shared-name">${escapeHtml(d.filename || "Shared file")}</div>
    <div class="shared-meta" id="meta">${fmtSize(d.size_bytes)} · preparing…</div>
    <div class="shared-spinner" id="spin"></div>
    <div class="shared-state" id="prog" style="color:var(--accent)">Connecting…</div>
    <div id="preview-area" style="display:none;margin-top:18px"></div>
    <button class="btn-primary" id="dl-btn" style="display:none;width:100%;margin-top:12px">⬇ Download</button>`;
  try {
    const passphrase = getSharedPassphrase(d.org_id);
    const prog = document.getElementById("prog");
    const spin = document.getElementById("spin");
    const meta = document.getElementById("meta");
    const previewArea = document.getElementById("preview-area");
    const dlBtn = document.getElementById("dl-btn");
    const ct = await fetchAllChunksShared(token, password, d.size_bytes, (pct, txt) => {
      spin.style.display = "none";
      prog.textContent = txt;
    });
    prog.textContent = "Decrypting…";
    let plain;
    try {
      plain = await decryptAssembled(ct, passphrase);
    } catch (e) {
      prog.innerHTML = `<span style="color:var(--danger)">Decryption failed (wrong passphrase?)</span>`;
      return;
    }
    const ext = (d.filename || "").split(".").pop().toLowerCase();
    const mime = getMime(ext);
    const blob = new Blob([plain], { type: mime });
    const urlBlob = URL.createObjectURL(blob);
    const isImage = ["png","jpg","jpeg","gif","svg","webp","bmp","heic","heif","avif","tiff","ico"].includes(ext);
    const isPdf = ext === "pdf";
    const isVideo = ["mp4","webm"].includes(ext);
    const isAudio = ["mp3","wav","ogg"].includes(ext);
    if (isImage) {
      previewArea.style.display = "";
      previewArea.innerHTML = `<img src="${urlBlob}" alt="${escapeHtml(d.filename)}" style="max-width:100%;max-height:50vh;border-radius:12px;display:block;margin:0 auto;box-shadow:var(--glass-shadow)">`;
      meta.textContent = `${fmtSize(d.size_bytes)} · image preview`;
    } else if (isPdf) {
      previewArea.style.display = "";
      previewArea.innerHTML = `<iframe src="${urlBlob}" style="width:100%;height:50vh;border:none;border-radius:12px;background:white"></iframe>`;
      meta.textContent = `${fmtSize(d.size_bytes)} · PDF preview`;
    } else if (isVideo) {
      previewArea.style.display = "";
      previewArea.innerHTML = `<video controls style="width:100%;max-height:50vh;border-radius:12px"><source src="${urlBlob}" type="${mime}"></video>`;
      meta.textContent = `${fmtSize(d.size_bytes)} · video preview`;
    } else if (isAudio) {
      previewArea.style.display = "";
      previewArea.innerHTML = `<audio controls style="width:100%"><source src="${urlBlob}" type="${mime}"></audio>`;
      meta.textContent = `${fmtSize(d.size_bytes)} · audio preview`;
    }
    // download button
    dlBtn.style.display = "";
    dlBtn.onclick = () => {
      const a = document.createElement("a");
      a.href = urlBlob;
      a.download = d.filename || "download";
      a.click();
    };
    if (!isImage && !isPdf && !isVideo && !isAudio) {
      // auto-download for non-previewable
      dlBtn.click();
    }
    prog.innerHTML = `<span class="shared-success-icon">✅</span><div style="margin-top:8px;color:var(--success)">Ready — preview or download</div>`;
  } catch (e) { console.error(e); showError(); }
}

function setErr(msg) {
  const el = document.getElementById("err");
  if (el) el.textContent = msg;
}

// password eye toggle (shared.html)
document.querySelectorAll(".pw-toggle[data-target]").forEach(btn => {
  btn.addEventListener("click", () => {
    const input = document.getElementById(btn.dataset.target);
    if (!input) return;
    if (input.type === "password") { input.type = "text"; btn.textContent = "🙈"; }
    else { input.type = "password"; btn.textContent = "👁️"; }
  });
});

async function downloadWithProgress(r, onProgress) {
  const cl = +r.headers.get("Content-Length") || 0;
  const reader = r.body.getReader();
  const chunks = [];
  let received = 0;
  const t0 = Date.now();
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    if (cl) {
      const pct = Math.round(received / cl * 100);
      const elapsed = (Date.now() - t0) / 1000;
      const speed = received / Math.max(elapsed, .01);
      const eta = Math.round((cl - received) / Math.max(speed, 1));
      onProgress(pct, `⬇ ${pct}% · ${fmtSpeed(speed)} · ETA ${eta}s`);
    }
  }
  const out = new Uint8Array(received);
  let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return new Blob([out]);
}

function showError() {
  content.innerHTML = `
    <div class="shared-expired">🔒</div>
    <div class="shared-name">Link unavailable</div>
    <div class="shared-meta">This link may have expired or been removed.</div>`;
}

function fmtSize(n) {
  if (!n) return "—";
  for (const u of ["B","KB","MB","GB","TB"]) { if (Math.abs(n) < 1024) return `${n.toFixed(1)} ${u}`; n /= 1024; }
  return `${n.toFixed(1)} PB`;
}
function fmtSpeed(b) {
  if (b < 1000) return b.toFixed(0) + " B/s";
  if (b < 1e6) return (b/1000).toFixed(1) + " KB/s";
  return (b/1e6).toFixed(1) + " MB/s";
}
function escapeHtml(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
loadInfo();
</script>
</body>
</html>
